name: CI

# Fast, deterministic gate for code pushes and PRs. release.sh marks its commit
# [skip actions] and explicitly dispatches one Release workflow, even when the
# same push contains earlier local commits. The paths below are a second guard
# for version-only bumps made outside the script. Keep this list in sync with
# VERSION_FILES in release.sh.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - pyproject.toml
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/Cargo.toml
      - Cargo.lock
      - desktop/package.json
      - uv.lock
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      # Proves the dependency graph resolves from a clean checkout (no sibling
      # repos, no path sources). This is the regression guard for the
      # matrx-scheduler path-dependency that used to break `uv sync` on CI.
      - name: Install dependencies
        run: uv sync --extra transcription --no-cache
        shell: bash

      - name: Byte-compile (syntax check)
        run: uv run python -m compileall -q app run.py

      - name: Tool registry drift (non-blocking signal)
        continue-on-error: true
        run: uv run --frozen python scripts/check_tool_db_drift.py

      - name: Lint (advisory)
        run: uv run ruff check app || true

      - name: Smoke + parity tests
        run: uv run --frozen pytest tests/smoke tests/parity tests/unit -q
        env:
          TUNNEL_ENABLED: "0"
          TAURI_SIDECAR: "1"
          # Skip device-probe tests that need real display/audio/network hardware.
          MATRX_CI_HEADLESS: "1"

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm tsc -b

      - name: Native browser confirmations are forbidden
        run: pnpm check:native-confirm
      - name: the native-confirm guard can still fail (self-test)
        run: pnpm check:native-confirm:self-test

      # THERE IS ONE AGENT PICKER — `@ai-matrx/agents/catalog/react` (rulings
      # D1/D4, 2026-09-08: matrx-local is never an exception; offline is a data
      # location, not a different list). This desktop shipped a 912-line
      # hand-rolled `AgentPicker` with its own sorts, filters and a hardcoded
      # default-agent NAME. The guard blocked in `release.sh` only, so a
      # re-grown fork could sit on main until someone cut a release; ~1s static
      # scan, so it runs per PR too. The self-test proves the detector can
      # still fail.
      - name: THERE IS ONE AGENT PICKER
        run: pnpm check:canonical-pickers
      - name: the picker guard can still fail (self-test)
        run: pnpm check:canonical-pickers:self-test

      # THE ARCHIVED-ITEMS LAW (Arman, 2026-09-09 —
      # ../../../common-docs/policies/archived-items.md). The Claude History
      # Inventory shipped the archive plumbing in three layers and set it in
      # none, so 1,671 real archived Claude sessions rendered mixed in with live
      # ones. This scans BOTH halves of the app — desktop/src and app/.
      - name: THE ARCHIVED-ITEMS LAW
        run: pnpm check:archived-items-law
      - name: the archive guard can still fail (self-test)
        run: pnpm check:archived-items-law:self-test

      # v1.3.104 shipped a crash that killed the app on boot for every user.
      # Typecheck passed and the bundle built — nothing here ever RENDERED the
      # app. This step does: it boots the real production bundle in Chromium
      # and fails if the ErrorBoundary shows or anything throws.
      # The authenticated half of boot.spec.ts self-skips without a test
      # account (desktop/.env.test), so no test-account secret is needed.
      #
      # But the SUPABASE vars ARE required: Vite inlines them at build time and
      # the Login page cannot render without them, so a bundle built without
      # them fails this step for a reason that has nothing to do with the app
      # being broken. They are the same two values release.yml already injects
      # (and the same ones that ship inside every binary — publishable, not
      # secret). Locally these come from desktop/.env, which is gitignored;
      # that is why this passes on a dev machine and failed the first time it
      # ran in CI.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot smoke (production bundle must render)
        run: SMOKE_PREVIEW=1 pnpm exec playwright test boot.spec.ts --reporter=list
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}

  native-vault-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Native Vault provenance guard detects its own weakenings
        run: desktop/scripts/check-native-vault-core-negative.sh

      - name: Native Vault core provenance and protocol gate
        run: desktop/scripts/check-native-vault-core.sh

  # The workspace added by folder-sync spike FS-C1 (crates/matrx-sync,
  # crates/matrx-syncd, desktop/src-tauri). Before this job, ci.yml compiled no
  # Rust at all: the only workflow that built the workspace was release.yml, so
  # a Rust regression could sit on main until someone cut a release.
  #
  # This is where FS-C3's property tests will run — the pure planner's
  # termination / no-panic / convergence / data-preservation proofs are
  # `cargo test` in crates/matrx-sync, and `--workspace` picks them up with no
  # further wiring.
  #
  # ubuntu-22.04 because every other job in this file uses it and it is the
  # same runner the release's Linux leg builds on.
  #
  # WHY `--exclude aimatrx-desktop`, proven not assumed: run 34791870514 tried
  # a plain `--workspace` and the Tauri build script failed with
  #   resource path `sidecar/matrx-engine-x86_64-unknown-linux-gnu` doesn't exist
  # tauri-build validates every `bundle.externalBin` entry at COMPILE time, so
  # compiling the app here would mean first producing all four sidecars —
  # including the 363 MB PyInstaller engine (~10+ min). That is a release job,
  # and release.yml already compiles the app on all four targets. This job
  # covers everything else in the workspace, and picks up new crates
  # automatically rather than naming them.
  #
  # --locked so a Cargo.lock that does not match the manifests fails here
  # rather than in a release.
  rust-workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml pins the target dir out of the workspace root.
          workspaces: ". -> desktop/src-tauri/target"

      - name: cargo build --workspace --locked (app excluded — see above)
        run: cargo build --workspace --exclude aimatrx-desktop --locked

      - name: cargo test --workspace --locked (app excluded — see above)
        run: cargo test --workspace --exclude aimatrx-desktop --locked
