[package]
name = "matrx-syncd"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "AI Matrx folder-sync daemon (scaffold — does not sync anything yet)"
publish = false

# The binary name is load-bearing: it is bundled as a Tauri externalBin
# sidecar and MUST NOT match the app's engine kill patterns
# ("Matrx Engine|matrx-engine|aimatrx-engine", desktop/src-tauri/src/lib.rs).
[[bin]]
name = "matrx-syncd"
path = "src/main.rs"

[dependencies]
matrx-sync = { path = "../matrx-sync" }
tokio = { workspace = true }
# The control API is HTTP/1.1 over TWO transports (C6 + C7), so the server must be transport
# agnostic: hyper serves any AsyncRead + AsyncWrite, which a Unix socket, a Windows named pipe and
# a TCP stream all are. A framework that assumes TCP could not serve the socket at all.
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
tokio-stream = { version = "0.1.17", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
base64 = "0.22.1"
rand = "0.9.2"
# The clobber check asks the server whether a live daemon is answering before refusing to start.
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `kill(pid, 0)` is an existence check that sends nothing — rule 9 stays true.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
# C6 names the pipe suffix as sha1(user SID)[:12]. A naming hash, never a security primitive.
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
# The control-API battery drives a REAL daemon over HTTP; a blocking client keeps those tests
# free of an async runtime they would otherwise only need for the request.
reqwest = { workspace = true, features = ["blocking"] }
serde_json = "1.0.151"
