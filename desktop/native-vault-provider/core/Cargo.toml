[package]
name = "native-vault-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
coset = "0.4"
passkey-authenticator = "0.5.0"
passkey-types = "0.5.0"
p256 = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }
zeroize = "1"

[dev-dependencies]

[features]
default = []
test-harness = []
protocol-test-harness = ["test-harness"]

[[bin]]
name = "protocol-harness"
path = "src/bin/protocol-harness.rs"
required-features = ["test-harness"]

[patch.crates-io]
passkey-authenticator = { path = "vendor/passkey-authenticator" }
