[package]
name = "matrx-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "AI Matrx folder-sync engine: journal, pure planner, simulation harness"
publish = false

[lints.rust]
missing_docs = "warn"

[dependencies]
# Inherited, never pinned here: the Tauri app also depends on rusqlite, and two versions of
# `libsqlite3-sys` (`links = "sqlite3"`) cannot coexist in one workspace. The workspace declares
# SPEC-ENGINE §5's rusqlite 0.40.2 with `bundled` — no system sqlite3 on a user's machine may be
# assumed.
rusqlite = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# SPEC-ENGINE §5's list. Invariant I8 makes NFC/NFD twins a `unicode_collision`, "never a silent
# rename" — which needs real normalisation, not a case fold. Independent verification found the
# class unreachable without it (F5).
unicode-normalization = "0.1"
# FS-L1 unit 2. SPEC-ENGINE §5 names these two versions and says explicitly "notify **8.2.0** (not
# the 9.0.0 rc)". The latest published today are 9.0.0-rc.5 and 0.8.0-rc.2; "always latest" is not
# "adopt a release candidate", and the frozen spec picked the stable line deliberately.
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
file-id = "0.2.3"
# FS-L1 unit 4b. Two knobs in SPEC-ENGINE section 2 are promises about the real filesystem that
# std cannot keep: `sync.trash_local_deletes` (default true) needs the OS trash on all three
# platforms, and a preserved mtime is what keeps the scanner's size/mtime fast path working on
# every file sync itself wrote. Declared here because every import is declared (Hard Rule 5).
filetime = "0.2.27"
trash = "5.2.3"

# ---- FS-C5 custody (SPEC-CUSTODY). The planner, the journal and the harness stay pure; `custody`
# is the one module in this crate that speaks HTTP, reads a clock and touches the OS keychain, and
# every one of those sits behind a trait so the state machine is testable without any of them
# (SPEC-CUSTODY §13).
async-trait = "0.1.90"
# S6: `keyring` 4.2.0, DEFAULT features — the `v1` set resolves to exactly our three stores
# (apple keychain, Windows credential manager, Secret Service). Never a disk fallback (S7).
keyring = "4.2.0"
reqwest = { workspace = true }
tokio = { workspace = true }
chrono = { version = "0.4.43", default-features = false, features = ["clock", "serde", "std"] }
# PKCE (S5): 256-bit state and a 32-byte verifier from the OS CSPRNG.
rand = "0.9.2"
sha2 = "0.10.9"
base64 = "0.22.1"
urlencoding = "2.1.3"

# S18: the daemon posts its own OS notification when the app is not running to post one for it.
# `mac-notification-sys` rather than an `osascript` shell-out: a shell-out inherits no bundle
# identity, shows the Script Editor icon, and fails silently under a hardened runtime.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.9"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.12.0"

[dev-dependencies]
proptest = "1.11.0"
sha2 = "0.10.9"
unicode-normalization = "0.1"
tempfile = "3"
# The FS-C5 battery lives in tests/custody.rs, which sees only the public API plus these.
tokio = { workspace = true }
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.151"
base64 = "0.22.1"
urlencoding = "2.1.3"
