[package]
name = "aimatrx-desktop"
version = "1.4.164"
description = "AI Matrx Desktop — Local companion for the AI Matrx platform"
authors = ["AI Matrx"]
edition = "2021"

[lib]
name = "aimatrx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api enables .transparent() on WebviewWindowBuilder for macOS.
# Required for the floating transcript overlay window. The feature is a no-op
# on Windows and Linux — safe to declare unconditionally.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-macos-permissions = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest.workspace = true
rusqlite.workspace = true
base64 = "0.22"
semver = "1"

# Transcription (whisper.cpp)
whisper-cpp-plus = { version = "0.1", features = ["async"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
cpal = "0.15"
futures-util = "0.3"
tokio.workspace = true
log = "0.4"
rubato = "1"
audioadapter-buffers = "2.0.0"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-window-state = "2"

# Wake word detection reuses whisper-cpp-plus — no additional dependencies needed.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Reads the app bundle's own Info.plist during a relaunch, so an update that
# renamed CFBundleExecutable still comes back up (see spawn_successor_process).
# Already in the tree as a tauri dependency — no new download.
plist = "1"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSString", "NSURL", "NSError"] }
# Privacy (TCC) permissions the APP process must request itself — Contacts,
# Calendars, Reminders, Photos, Location, Speech Recognition, Bluetooth. The
# nested Python engine has no run loop and cannot own these prompts (see
# src/tcc.rs). Default features on: they only pull the framework bindings.
block2 = "0.6"
objc2-contacts = "0.3.2"
objc2-event-kit = "0.3.2"
objc2-photos = "0.3.2"
objc2-core-location = "0.3.2"
objc2-speech = "0.3.2"
objc2-core-bluetooth = "0.3.2"

[features]
# No features are enabled by default — acceleration is opt-in per platform.
# macOS builds pass --features metal via the CI workflow.
# Windows/Linux builds can pass --features cuda or --features openblas.
default = []
cuda = ["whisper-cpp-plus/cuda"]
metal = ["whisper-cpp-plus/metal"]
openblas = ["whisper-cpp-plus/openblas"]
