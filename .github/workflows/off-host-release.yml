name: Off-host Release
run-name: "off-host release: ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version increment"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact X.Y.Z version (overrides bump when set)"
        required: false
        type: string
      message:
        description: "Release commit message (the script adds [skip actions])"
        required: false
        type: string
        default: "release: off-host"
      refresh_matrx_packages:
        description: "Refresh only the @ai-matrx lock graph after reviewing package consumer actions"
        required: true
        type: boolean
        default: false

# Serialize version-bump requests with each other. release.yml owns its own
# build/publish lane; the guards below reject a stale or competing dispatch
# before this workflow performs any release mutation.
concurrency:
  group: matrx-local-version-bump
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Require the canonical main branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Off-host releases must be dispatched from main (received $DISPATCH_REF)." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a stale or competing release request
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$CURRENT_MAIN" != "$DISPATCH_SHA" ]]; then
            echo "main moved after this request was queued; refusing a second or stale release." >&2
            echo "requested=$DISPATCH_SHA current=$CURRENT_MAIN" >&2
            exit 1
          fi

          for status in queued pending waiting in_progress requested action_required; do
            COUNT="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
              --status "$status" --limit 100 --json databaseId --jq length)"
            [[ "$COUNT" =~ ^[0-9]+$ ]] || {
              echo "Invalid release-slot response for status $status." >&2
              exit 1
            }
            if [[ "$COUNT" -gt 0 ]]; then
              echo "release.yml already has an active or queued run; refusing a competing release." >&2
              exit 1
            fi
          done

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --ff-only origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Refresh the reviewed @ai-matrx package lock graph
        if: inputs.refresh_matrx_packages
        working-directory: desktop
        run: pnpm sync:matrx-packages

      - name: Commit the package lock catch-up
        if: inputs.refresh_matrx_packages
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/pnpm-lock.yaml; then
            echo "The @ai-matrx package lock graph was already current."
            exit 0
          fi

          UNEXPECTED="$(git status --porcelain | awk '$2 != "desktop/pnpm-lock.yaml" { print }')"
          if [[ -n "$UNEXPECTED" ]]; then
            echo "Package catch-up changed files other than desktop/pnpm-lock.yaml:" >&2
            echo "$UNEXPECTED" >&2
            echo "Refusing to automate a change that may require consumer adoption." >&2
            exit 1
          fi

          git add desktop/pnpm-lock.yaml
          git commit -m "chore(deps): every @ai-matrx package to npm latest [skip actions]"
          echo "Package catch-up committed locally. The canonical release path will"
          echo "validate it, add the release commit/tag, and push all three atomically."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the canonical release path
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          RELEASE_MESSAGE="${RELEASE_MESSAGE:-release: off-host}"
          if [[ -n "$RELEASE_VERSION" ]]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Exact version must have the form X.Y.Z." >&2
              exit 1
            }
            RELEASE_SELECTOR=("$RELEASE_VERSION")
          else
            RELEASE_SELECTOR=("--${RELEASE_BUMP}")
          fi
          ./scripts/release.sh "${RELEASE_SELECTOR[@]}" --message "$RELEASE_MESSAGE"
