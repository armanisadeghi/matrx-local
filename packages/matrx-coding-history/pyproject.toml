[project]
name = "matrx-coding-history"
version = "0.1.0"
description = "Claude Code's local history, read and turned into AI Matrx coding-session bridge envelopes: the importer and capture reconciler shared by Matrx Local and Matrx 2. Apps inject storage, delivery, identity and HTTP through ports."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"
