# Cargo workspace root — AI Matrx Local.
#
# Added by folder-sync spike FS-C1 (common-docs/projects/folder-sync/REGISTER.md).
# Three members: the sync library, the sync daemon binary, and the Tauri app.
# The daemon and the app therefore compile the SAME `matrx-sync` crate — one
# source, two packagings (folder-sync DECISIONS.md D1).
#
# Target directory: NOT the workspace root. `.cargo/config.toml` pins it to
# `desktop/src-tauri/target` so every path the release pipeline already
# hardcodes stays correct. Rationale and alternatives: crates/README.md.

[workspace]
resolver = "2"
members = [
    "crates/matrx-egress",
    "crates/matrx-sync",
    "crates/matrx-syncd",
    "desktop/src-tauri",
]
# The macOS Native Vault provider core is its own standalone cargo project with
# its own release cadence and its own provenance gate
# (desktop/scripts/check-native-vault-core.sh). Without this exclusion cargo
# refuses to build it at all ("current package believes it's in a workspace
# when it's not").
exclude = ["desktop/native-vault-provider"]

# The app's own version is NOT inherited from here: scripts/release.sh bumps
# `desktop/src-tauri/Cargo.toml`'s literal `version = "..."` line. The sync
# crates version independently of the shipped app.
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AI Matrx"]

# Pinned at the versions the Tauri crate already shipped (desktop/src-tauri
# Cargo.toml, v1.4.106) so the daemon and the app can never diverge.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# Latest published (0.40.2, checked 2026-09-13). No-legacy law: every touched
# package moves to latest. `bundled` because no user machine may be assumed to
# have a system sqlite3. libsqlite3-sys declares `links = "sqlite3"`, so every
# crate in the workspace MUST share this one version — two rusqlite majors in
# one binary do not resolve. Inherit it, never re-pin it locally.
rusqlite = { version = "0.40.2", features = ["bundled"] }
