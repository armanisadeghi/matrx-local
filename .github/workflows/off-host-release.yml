name: Off-host Release
run-name: "off-host release: ${{ inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version increment"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      message:
        description: "Release commit message (the script adds [skip actions])"
        required: false
        type: string
        default: "release: off-host"
      refresh_matrx_packages:
        description: "Refresh only the @ai-matrx lock graph after reviewing package consumer actions"
        required: true
        type: boolean
        default: false

# Serialize the hosted version bump with the build/publish workflow. The
# release script dispatches release.yml before this run exits; that run queues
# behind this short wrapper and takes ownership of the same lane next.
concurrency:
  group: matrx-local-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Require the canonical main branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Off-host releases must be dispatched from main (received $DISPATCH_REF)." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --ff-only origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Refresh the reviewed @ai-matrx package lock graph
        if: inputs.refresh_matrx_packages
        working-directory: desktop
        run: pnpm sync:matrx-packages

      - name: Commit the package lock catch-up
        if: inputs.refresh_matrx_packages
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/pnpm-lock.yaml; then
            echo "The @ai-matrx package lock graph was already current."
            exit 0
          fi

          UNEXPECTED="$(git status --porcelain | awk '$2 != "desktop/pnpm-lock.yaml" { print }')"
          if [[ -n "$UNEXPECTED" ]]; then
            echo "Package catch-up changed files other than desktop/pnpm-lock.yaml:" >&2
            echo "$UNEXPECTED" >&2
            echo "Refusing to automate a change that may require consumer adoption." >&2
            exit 1
          fi

          git add desktop/pnpm-lock.yaml
          git commit -m "chore(deps): every @ai-matrx package to npm latest [skip actions]"
          echo "Package catch-up committed locally. The canonical release path will"
          echo "validate it, add the release commit/tag, and push all three atomically."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the canonical release path
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          RELEASE_MESSAGE="${RELEASE_MESSAGE:-release: off-host}"
          ./scripts/release.sh "--${RELEASE_BUMP}" --message "$RELEASE_MESSAGE"
