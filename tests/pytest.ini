[pytest]
testpaths = tests
timeout = 30
# Exclude fixture setup/teardown from the 30s per-test timer. The session
# engine fixture (tests/conftest.py) legitimately waits up to 60s for the
# real engine to boot; without this, the FIRST test using the fixture was
# killed at 30s mid-boot. Individual test bodies still get 30s each.
timeout_func_only = true
markers =
    slow: marks tests as slow — included only with --full flag
    macos_only: test only runs on macOS
    windows_only: test only runs on Windows
    linux_only: test only runs on Linux
    network: test requires outbound network — skipped unless MATRX_LIVE_CHECKS=1
addopts = -v --tb=short
