[package]
name = "matrx-egress"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "AI Matrx Home Connection — the residential-egress helper (the device leg of the egress relay)"
publish = false

# The binary name is load-bearing twice over: it is the Tauri `externalBin`
# sidecar name (`scripts/build-egress.sh --sidecar`) and the name the desktop
# engine's supervisor resolves. It must not match the app's engine kill
# patterns ("Matrx Engine|matrx-engine|aimatrx-engine").
[[bin]]
name = "matrx-egress"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
# The device leg. rustls only — no OpenSSL on a user's machine, and the same
# TLS stack reqwest already uses in this workspace.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Pairing and the device routes. Inherited from the workspace (rustls, no
# default features) so this crate can never pull a second TLS stack in.
reqwest = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
rand = "0.9.2"
# S6's store, used DIRECTLY rather than through `matrx-sync`'s `KeyringStore`:
# that type hard-codes the syncd service names via `World::keychain_service()`
# and a credential shape (refresh token + Supabase user id) that is not this
# helper's. Reusing it would have meant editing it, which this task forbids.
keyring = "4.2.0"
sha2 = "0.10"
hex = "0.4"
# The control listener speaks the same HTTP/1.1 over loopback that matrx-syncd
# serves, on the version already in this workspace's lock file.
hyper = { version = "1.8.1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
# "Open in AI Matrx" and the pairing page.
open = "5"
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tray. macOS and Windows only — on Linux the helper prints the same status
# on stdout and has no tray at all (the contract's "Linux headless").
#
# Versions are the ones this workspace's lock file already resolves through
# Tauri, so the helper adds no second copy of the objc2 / windows-sys stack.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.21"
tao = "0.34"

[dev-dependencies]
tempfile = "3"
# The fake gateway in `relay`'s tests runs a REAL TLS client through the relay, because a TLS
# handshake is the strictest possible check that every byte crossed unchanged in both directions.
# The same rustls the rest of the workspace already resolves — no second TLS stack.
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "1"

# ── Linux packaging (cargo-deb) ───────────────────────────────────────────────
# Assets only — no postinst magic. A systemd USER unit is shipped and the postinst PRINTS the one
# command that enables it, because root cannot enable another person's user unit and pretending to
# would be a false sentence.
[package.metadata.deb]
name = "ai-matrx-home-connection"
maintainer = "AI Matrx <support@aimatrx.com>"
copyright = "AI Matrx"
extended-description = """\
Lends this computer's internet connection to your own AI Matrx work, and only when a site has \
blocked AI Matrx's servers. It dials out and holds one connection: nothing listens on this \
computer, no ports are opened, and it only ever connects to public internet addresses."""
section = "net"
priority = "optional"
assets = [
    ["../../desktop/src-tauri/target/release/matrx-egress", "usr/bin/", "755"],
    ["packaging/matrx-egress.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/ai-matrx-home-connection/README.md", "644"],
]
maintainer-scripts = "packaging/deb-scripts"
