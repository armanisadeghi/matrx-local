[project]
name = "matrx-local"
version = "1.4.21"
description = "Companion desktop application for AI Matrx — extends web platform with local capabilities via FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core server
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "httptools",
    "pyyaml",
    "watchfiles",
    "websockets",
    # Transformers is installed on demand outside the frozen engine, but its
    # lazy utilities import Jinja and tqdm submodules from the engine bundle.
    # Declare/bundle both directly so PyInstaller cannot ship partial transitive
    # copies (observed live: jinja2.meta and tqdm.contrib.logging missing).
    "jinja2>=3.1.6",
    "tqdm>=4.67.3",
    # HTTP client (scraping proxy, file transfer)
    "httpx",
    # Clipboard
    "pyperclip",
    # Notifications
    "plyer",
    # macOS TCC permission checks and framework access
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-Contacts>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-EventKit>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-Photos>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-CoreLocation>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-Speech>=12.1; sys_platform == 'darwin'",
    # System tray
    "pystray",
    "pillow",
    # Logging
    "concurrent-log-handler>=0.9.28",
    # Packaging
    "pyinstaller",
    # Database
    "asyncpg",
    "aiosqlite>=0.20.0",
    # Scraper engine (from scraper-service)
    "curl-cffi>=0.14.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "selectolax>=0.4.6",
    "cachetools>=5.5,<7.0",
    "tldextract>=5.3.1",
    "markdownify>=0.14.1",
    "tabulate>=0.9.0",
    "PyMuPDF>=1.27.1",
    "pytesseract>=0.3.13",
    # Matrx — all pulled from PyPI. PyPI publishes happen via tag-push
    # to ``matrx-<pkg>/v<x.y.z>`` (see aidream/.github/workflows/
    # publish-package.yml). There is intentionally no [tool.uv.sources]
    # path override — see the note further down near [tool.uv].
    # All matrx-* pins resolve from PyPI (matrx-ai 0.4.18 wave, 2026-07-18:
    # client-host capability resolution plus the consolidated desktop discovery
    # contract. The 0.4.16 floor keeps the provider schema aligned with the live
    # desktop registry and declares graph plus scraper browser runtime dependencies.
    # These floors track the aidream source-of-truth wave exactly (the brain
    # runs the same versions). matrx-connect/graph/runtime arrive transitively
    # via matrx-ai but are pinned explicitly so a future matrx-ai dependency
    # reshuffle can't silently downgrade them.
    # matrx-utils 2.0.7 / matrx-connect 0.1.25 floors are LOAD-BEARING, not
    # cosmetic. matrx-connect's middleware/auth.py has imported
    # matrx_utils.AsyncSingleFlight since 0.1.8, but matrx-utils first exported
    # that symbol in 2.0.1 (and LEGACY_VISIBILITY_MAP / VisibilityLiteral in
    # 2.0.7). Nothing was removed upstream — the symbols were ADDED and the
    # consumers' floors never moved, so `matrx-utils>=2.0.0` +
    # `matrx-connect>=0.1.10` resolved a pair that raises on import:
    #   ImportError: cannot import name 'AsyncSingleFlight' from 'matrx_utils'
    # That pair is what actually resolved into .venv here (MXL-D-075). It stayed
    # invisible only because matrx_connect/__init__.py does not eagerly import
    # `middleware` and nothing here imports that submodule yet — the first
    # auth-middleware import would have killed the AI streaming surface. Fixed
    # upstream in matrx-connect 0.1.25; do not lower these floors.
    "matrx-utils>=2.0.7",
    # 3.1.49 is LOAD-BEARING, not cosmetic — same defect class as MXL-D-075.
    # matrx-scraper's `db/__init__.py` imports PLATFORM_DB_ENV_PREFIX /
    # platform_connection_url / register_platform_db (the ONE-database
    # resolver), which matrx-orm first exports in 3.1.49. With the old
    # `>=3.1.16` floor, `uv sync` resolved matrx-scraper 0.1.107 + matrx-orm
    # 3.1.16 — a pair that raises on the FIRST line of our local scrape lane:
    #   from matrx_scraper.cache import MemoryCache
    #   ImportError: cannot import name 'PLATFORM_DB_ENV_PREFIX' from 'matrx_orm'
    # (matrx-scraper also stopped reaching its optional [db] extra from that
    # core import, but the floor is what makes the pair resolvable at all.)
    # Do not lower this.
    "matrx-orm>=3.1.49",
    "matrx-ai>=0.4.18",
    "matrx-connect>=0.1.25",
    "matrx-graph>=0.1.5",
    "matrx-runtime>=0.0.6",
    # Canonical Office (docx/pptx/xlsx) codec — matrx_files.specific_handlers.office
    # (extract_office / generate_office + the spec models). Local Read of an Office
    # file returns markdown via this codec; the OfficeGenerate tool renders bytes
    # from a spec. NEVER fork/vendor the codec — depend on the published package.
    # Present transitively via matrx-ai, but the office submodule only exists from
    # 0.1.10, so we pin the floor here explicitly (Hard Rule 5). Its pure-python
    # Office deps (python-docx/pptx/openpyxl/xlsxwriter) come in with it.
    "matrx-files>=0.1.11",
    # THE scraper. There is exactly one scraping/parsing engine in the platform
    # and this is it — matrx-local runs it in a LOCAL lane (the user's own
    # machine and residential IP, never a proxy), it does not own a copy. Until
    # 2026-08-09 a forked `scraper-service/` subtree shipped a second
    # BeautifulSoup/fetcher/orchestrator here; that fork is deleted and every
    # behaviour it had that the package lacked was ported upstream first
    # (matrx-scraper 0.1.99 — see its FEATURE.md change log). Extras are named
    # explicitly even though matrx-local already declares playwright /
    # curl-cffi / pymupdf / pytesseract itself: "present transitively" is not a
    # dependency declaration (Hard Rule 5). Deliberately NOT installed:
    # [db] (no Postgres here — durable storage is SQLite + the server),
    # [dedup] (datasketch pulls numpy, which the single-ML-stack doctrine
    # reserves for the managed media runtime slot).
    "matrx-scraper[browser,pdf,ocr]>=0.1.100",
    # matrx-scheduler — see the optional [scheduler] extra below. Kept OUT of
    # core on purpose: the Phase 8 host that uses it is gated off by default
    # (MATRX_LOCAL_SCHEDULER_ENABLED) and imports it lazily, so the engine runs
    # fine without it. Install with `uv sync --extra scheduler` (it is bundled
    # into release builds — see scripts/build-sidecar.sh / specs).
    # Supabase Python client — powers the engine↔extension Broadcast plumb
    # in `app/api/extension_broadcast.py` (C2.d substrate). Already pulled in
    # transitively via matrx-ai/matrx-utils, but we declare it explicitly so
    # the import graph is self-documenting and a future minor-version bump
    # in those upstream packages can't silently drop it.
    "supabase>=2.28.0",
    # OS keychain access for encrypting credentials at rest in matrx.db
    # (macOS Keychain / Windows Credential Manager / Linux Secret Service).
    "keyring>=25.0.0",
    # Trash-first Delete tool (app/tools/tools/file_ops.py tool_delete) —
    # a remote agent's delete must be recoverable from the OS trash.
    "send2trash>=1.8.3",
    # AES-256-GCM + scrypt + RSA-OAEP for the Private Media Vault
    # (app/services/media_vault/) and keyring's Fernet backend. Declared
    # explicitly per Hard Rule 5 — "present transitively" is not a
    # dependency declaration.
    "cryptography>=43.0.0",
    "screeninfo>=0.8.1",
    # Media downloading & video processing
    "yt-dlp>=2024.1.0",
    "imageio-ffmpeg>=0.5.1",
    # Camera capture & video recording (webcam, VideoCapture, VideoWriter)
    "opencv-python>=4.10.0",
    # Screen capture fallback (used when system ffmpeg is unavailable)
    "mss>=9.0.1",
    # Browser automation
    "playwright",
    # System monitoring & process management
    "psutil>=6.0.0",
    # Network discovery (mDNS)
    "zeroconf>=0.131.0",
    # Audio hardware I/O
    "sounddevice>=0.5.5",
    "numpy>=2.4.2",
    # On-device wake word detection (ONNX inference, no cloud, cross-platform)
    # openwakeword's tflite-runtime Linux dep has no cp313+ wheels; we use ONNX only.
    "openwakeword>=0.6.0",
    "onnxruntime>=1.18.0",
    # Text-to-speech (Kokoro-82M via ONNX Runtime, ~300 MB model downloaded on first use)
    # espeak-ng is bundled cross-platform via espeakng-loader (no system install needed)
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.13.0",
]

[project.optional-dependencies]
transcription = [
    "openai-whisper",
]
scheduler = [
    # Cross-component scheduling host (surface='desktop'). Optional + lazily
    # imported; the Phase 8 host is gated off by default. Published on PyPI.
    "matrx-scheduler>=0.3.5",
]
image-gen = [
    # Hugging Face diffusers-based image AND video generation (large install).
    # Install with: uv sync --extra image-gen  (dev convenience only — end
    # users install via the in-app installer, see
    # app/services/image_gen/installer.py IMAGE_GEN_PACKAGES; keep these pins
    # in sync with that list).
    # diffusers >= 0.39 is required by the model catalogs (Flux2Klein, ZImage,
    # QwenImage, Wan, LTX pipelines). Torch: CPU-only wheels by default; for
    # GPU support install torch with CUDA manually.
    "torch>=2.6",
    "torchvision>=0.18.0",
    # Exact release: 0.37.x crashes on valid Civitai/AI-Toolkit Z-Image
    # adapters without per-layer .alpha tensors. Do not float this critical
    # loader dependency without validating the Civitai Z-Image fixture.
    "diffusers==0.39.0",
    "transformers>=5.3.0",
    "accelerate>=1.0",
    "peft>=0.13.1",
    "sentencepiece>=0.2.0",
    "gguf>=0.10.0",
    # protobuf intentionally NOT listed: the engine already carries it as a
    # core dep (via matrx-ai → xai-sdk, which hard-rejects protobuf 7). A
    # second copy in the runtime image-gen dir shadowed the engine's and
    # killed matrx-ai init in packaged builds ("Unsupported protobuf
    # version: 7.34.1", 2026-07-12). See installer.py IMAGE_GEN_PACKAGES.
    "huggingface_hub>=0.22.0",
]
ner = [
    # GLiNER2 local inference. The [local] extra brings torch/transformers for
    # on-device execution; base gliner2 alone is API/schema utilities only.
    "gliner2[local]>=1.3.2",
    # Classic GLiNER models remain useful for edge/large/XXL tiers.
    "gliner>=0.2.23",
    "huggingface_hub>=0.22.0",
]
embeddings = [
    # Local OpenAI-compatible /v1/embeddings via ONNX Runtime.
    "fastembed>=0.7.0",
]
all = [
    "openai-whisper",
    # Note: image-gen is NOT included in 'all' intentionally — it's a multi-GB
    # optional install. Enable explicitly with: uv sync --extra image-gen
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
]

# NOTE: there is intentionally no [tool.uv.sources] section. All matrx-*
# packages (including matrx-scheduler) resolve from PyPI. Do NOT add a path
# source for a sibling repo (e.g. ../aidream/packages/...): those paths do
# not exist on a clean checkout or on CI runners and break `uv sync` for
# everyone. To consume in-flight aidream-workspace changes ahead of a PyPI
# release, build a wheel from aidream and `uv pip install` it locally.

[tool.uv]
python-preference = "only-managed"
# xai-sdk (pulled via matrx-ai) hard-rejects protobuf 7.x at import time
# (`ValueError: Unsupported protobuf version`) but does not declare the cap
# in its metadata, and google-cloud-aiplatform happily resolves protobuf 7.
# Without this constraint the AI engine dies at startup on a fresh resolve.
constraint-dependencies = ["protobuf<7"]
# tflite-runtime has no Python 3.13/3.14 wheels.  openWakeWord uses it only on
# Linux as a second inference backend — we drive it via onnxruntime exclusively.
# The impossible marker ensures uv skips it entirely on all platforms.
override-dependencies = [
    "tflite-runtime ; python_version < '3.0'",
]
