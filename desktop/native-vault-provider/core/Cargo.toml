[package]
name = "native-vault-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
jiter = { version = "0.17.0", default-features = false }
coset = "0.4"
ciborium = "0.2"
passkey-authenticator = "0.5.0"
passkey-types = "0.5.0"
p256 = { version = "0.13", features = ["pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uniffi = { version = "0.32.1", optional = true, features = ["cli"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
static_assertions = "1"

[features]
default = []
protocol-test-harness = []
source-export-test-harness = []
import-rp-proof-harness = []
native-bridge = ["dep:uniffi"]

[[bin]]
name = "protocol-harness"
path = "src/bin/protocol-harness.rs"
required-features = ["protocol-test-harness"]

[[bin]]
name = "import-rp-proof-harness"
path = "src/bin/import-rp-proof-harness.rs"
required-features = ["import-rp-proof-harness"]

[[bin]]
name = "native-vault-bindgen"
path = "src/bin/native-vault-bindgen.rs"
required-features = ["native-bridge"]

[[bin]]
name = "source-export-harness"
path = "src/bin/source-export-harness.rs"
required-features = ["source-export-test-harness"]

[patch.crates-io]
jiter = { path = "vendor/jiter" }
passkey-authenticator = { path = "vendor/passkey-authenticator" }

# Standalone even when this checkout is a managed worktree inside another workspace.
[workspace]
