name: Release
run-name: "release: ${{ inputs.recover_tag || github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  # Manual trigger (e.g. from environments that cannot push tags). tauri-action
  # creates/uses the vX.Y.Z tag and release itself from tauri.conf.json, so a
  # dispatch from main is equivalent to pushing the tag — downstream jobs
  # resolve the tag from tauri.conf.json instead of github.ref_name.
  workflow_dispatch:
    inputs:
      recover_tag:
        description: "Finalize an existing draft release without rebuilding (for example, v1.3.134)"
        required: false
        type: string
      allow_unverified_backfill:
        description: "Allow updater-manifest backfill entries whose signature key does not match the current updater pubkey (key rotation only — normally leave false)"
        required: false
        type: boolean
        default: false

concurrency:
  group: matrx-local-release
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recover_tag == '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --frozen --extra transcription --extra scheduler --extra image-gen --no-cache

      - name: Verify deterministic image-runtime contracts
        run: |
          uv run --frozen --no-sync python scripts/generate-runtime-manifests.py --check
          uv run --frozen --no-sync python scripts/generate-runtime-locks.py --check

      - name: Byte-compile Python
        run: uv run python -m compileall -q app run.py

      - name: Tool registry drift (non-blocking signal)
        continue-on-error: true
        run: uv run --frozen python scripts/check_tool_db_drift.py

      - name: Runtime import, authorization, parity, and unit test gate
        run: uv run --frozen pytest tests/smoke tests/parity tests/unit -q
        env:
          TUNNEL_ENABLED: "0"
          TAURI_SIDECAR: "1"
          MATRX_CI_HEADLESS: "1"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        working-directory: desktop
        run: pnpm tsc -b

      - name: Desktop unit tests
        working-directory: desktop
        run: pnpm test:unit
        env:
          # Unit tests must not depend on repository secrets. These values are
          # syntactically valid but point only at the local Supabase test stub.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: test-publishable-key

      - name: Install Playwright Chromium
        working-directory: desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot smoke (production bundle must render)
        working-directory: desktop
        run: SMOKE_PREVIEW=1 pnpm exec playwright test boot.spec.ts --reporter=list
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}

  # Create the draft ONCE before the build matrix starts. Letting each
  # tauri-action matrix leg race to create the same tag can produce two draft
  # releases with split assets; the finalizer then sees only half a release.
  prepare-release:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the single draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          TAG="v${VERSION}"
          mapfile -t RELEASE_IDS < <(
            gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .id"
          )
          if (( ${#RELEASE_IDS[@]} > 1 )); then
            echo "Multiple releases already exist for ${TAG}: ${RELEASE_IDS[*]}" >&2
            exit 1
          fi
          if (( ${#RELEASE_IDS[@]} == 1 )); then
            RELEASE_ID="${RELEASE_IDS[0]}"
            IS_DRAFT="$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq .draft)"
            [[ "$IS_DRAFT" == "true" ]] || {
              echo "Release ${TAG} already exists and is not a draft" >&2
              exit 1
            }
            TAG_SHA="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.sha)"
            [[ "$TAG_SHA" == "$GITHUB_SHA" ]] || {
              echo "Draft ${TAG} points to ${TAG_SHA}, but this run checks out ${GITHUB_SHA}; refusing to mix source cutoffs" >&2
              exit 1
            }
          else
            RELEASE_ID="$(gh api --method POST "repos/${REPO}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="AI Matrx ${TAG}" \
              -f body="See the assets below to download and install this version." \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "Prepared one draft release for ${TAG}: ${RELEASE_ID}"

  release:
    needs: [verify, prepare-release]
    if: ${{ needs.verify.result == 'success' && needs.prepare-release.result == 'success' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin --bundles app,dmg,updater --features metal
            syncd_target: aarch64-apple-darwin
          - platform: macos-15
            args: --target x86_64-apple-darwin --bundles app,dmg,updater --features metal
            syncd_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb
            syncd_target: ""
          - platform: windows-latest
            args: ""
            syncd_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # macos-15 still defaults to Xcode 16.4 even though the image includes
      # Xcode 26.3. The native Credential Export API is a macOS 26 SDK API, so
      # selecting the installed Xcode 26 toolchain is part of the build
      # contract rather than an optional runner preference.
      - name: Select Xcode 26 toolchain
        if: matrix.platform == 'macos-15'
        run: |
          DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          export DEVELOPER_DIR
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      # ---- Python sidecar build ----
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: |
          # --no-cache forces a fresh PyPI index fetch (avoids stale CDN edge cache
          # when a matrx-* package was published moments before this workflow ran).
          # Retry once after 30s if resolution fails — gives CDN time to propagate.
          uv sync --frozen --extra transcription --extra scheduler --no-cache || {
            echo "⚠ uv sync failed — retrying in 30s (PyPI CDN propagation delay)..."
            sleep 30
            uv sync --frozen --extra transcription --extra scheduler --no-cache
          }
        shell: bash

      - name: Import Apple certificate for code signing
        if: matrix.platform == 'macos-15'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Decode certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate into keychain
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to use the certificate without prompting
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add temp keychain to the search list (prepend so it's found first)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "✅ Apple certificate imported into temporary keychain"

      # The provider has a distinct bundle identifier and entitlement set, so
      # one host profile cannot authorize both code objects. Keep both private
      # profile inputs off the checkout and make their CMS envelopes a release
      # prerequisite before Tauri performs the host's final signing pass.
      #
      # A signed macOS release always ships the native Vault provider. Its
      # distinct bundle identifier and entitlement set require both profiles;
      # missing either one is a release configuration error, never a reason to
      # silently publish a host-only build. The host-only config remains for
      # local smoke work, but is not a release path.
      - name: Materialize macOS host and Vault provider profiles
        if: matrix.platform == 'macos-15'
        env:
          APPLE_HOST_PROVISIONING_PROFILE: ${{ secrets.APPLE_HOST_PROVISIONING_PROFILE }}
          APPLE_VAULT_PROVIDER_PROVISIONING_PROFILE: ${{ secrets.APPLE_VAULT_PROVIDER_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$APPLE_HOST_PROVISIONING_PROFILE" ]] || { echo "ERROR: APPLE_HOST_PROVISIONING_PROFILE is required for every signed macOS release; native Vault provider releases cannot fall back to a host-only build." >&2; exit 1; }
          [[ -n "$APPLE_VAULT_PROVIDER_PROVISIONING_PROFILE" ]] || { echo "ERROR: APPLE_VAULT_PROVIDER_PROVISIONING_PROFILE is required for every signed macOS release; native Vault provider releases cannot fall back to a host-only build." >&2; exit 1; }
          HOST_PROFILE="desktop/src-tauri/release-signing/host.provisionprofile"
          PROVIDER_PROFILE="$RUNNER_TEMP/vault-provider.provisionprofile"
          mkdir -p "$(dirname "$HOST_PROFILE")"
          printf '%s' "$APPLE_HOST_PROVISIONING_PROFILE" | base64 --decode > "$HOST_PROFILE"
          printf '%s' "$APPLE_VAULT_PROVIDER_PROVISIONING_PROFILE" | base64 --decode > "$PROVIDER_PROFILE"
          [[ -s "$HOST_PROFILE" ]] || { echo "ERROR: host provisioning profile decoded empty." >&2; exit 1; }
          [[ -s "$PROVIDER_PROFILE" ]] || { echo "ERROR: Vault provider provisioning profile decoded empty." >&2; exit 1; }
          security cms -D -u 9 -i "$HOST_PROFILE" -o /dev/null
          security cms -D -u 9 -i "$PROVIDER_PROFILE" -o /dev/null
          echo "MATRX_NATIVE_VAULT_PROVIDER=sealed" >> "$GITHUB_ENV"
          echo "✅ native Vault provider profiles verified; provider will be sealed into this release" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Python sidecar binary
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-15' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # These immutable public bootstrap values are baked into the binary
          # by scripts/write_bundled_config.py (called inside build-sidecar.sh).
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
        run: |
          chmod +x scripts/build-sidecar.sh
          if [[ "${{ matrix.args }}" == *"x86_64-apple-darwin"* ]]; then
            ./scripts/build-sidecar.sh --target x86_64-apple-darwin
          elif [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            ./scripts/build-sidecar.sh --target aarch64-apple-darwin
          else
            ./scripts/build-sidecar.sh
          fi
        shell: bash

      - name: Verify frozen sidecar managed-runtime contract
        run: |
          if [[ -x ".venv/bin/python" ]]; then
            PYTHON=".venv/bin/python"
          else
            PYTHON=".venv/Scripts/python.exe"
          fi
          if [[ "${{ matrix.args }}" == *"x86_64-apple-darwin"* ]] || [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            BINARY="desktop/src-tauri/sidecar/Matrx Engine.app/Contents/MacOS/Matrx Engine"
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            BINARY="desktop/src-tauri/sidecar/matrx-engine-x86_64-pc-windows-msvc.exe"
          else
            BINARY="desktop/src-tauri/sidecar/matrx-engine-x86_64-unknown-linux-gnu"
          fi
          if [[ "${{ matrix.args }}" == *"x86_64-apple-darwin"* ]]; then
            TARGET="x86_64-apple-darwin"
          elif [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            TARGET="aarch64-apple-darwin"
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            TARGET="x86_64-pc-windows-msvc"
          else
            TARGET="x86_64-unknown-linux-gnu"
          fi
          UV="desktop/src-tauri/binaries/uv-$TARGET"
          if [[ "$TARGET" == *"windows"* ]]; then
            UV="${UV}.exe"
          fi
          # build-sidecar already performed the expensive full locked-runtime
          # probe with bundled uv; independently re-check the copied archive.
          "$PYTHON" scripts/verify-frozen-runtime.py --binary "$BINARY" --python "$PYTHON" --uv "$UV" --target "$TARGET" --archive-only
        shell: bash

      - name: Download cloudflared sidecar binary
        run: |
          chmod +x scripts/download-cloudflared.sh
          if [[ "${{ matrix.args }}" == *"x86_64-apple-darwin"* ]]; then
            ./scripts/download-cloudflared.sh --target x86_64-apple-darwin
          elif [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            ./scripts/download-cloudflared.sh --target aarch64-apple-darwin
          elif [[ "${{ matrix.platform }}" == "ubuntu-22.04" ]]; then
            ./scripts/download-cloudflared.sh --target x86_64-unknown-linux-gnu
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            ./scripts/download-cloudflared.sh --target x86_64-pc-windows-msvc
          fi
        shell: bash

      - name: Download llama-server sidecar binary
        run: |
          chmod +x scripts/download-llama-server.sh
          if [[ "${{ matrix.args }}" == *"x86_64-apple-darwin"* ]]; then
            ./scripts/download-llama-server.sh --target x86_64-apple-darwin
          elif [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            ./scripts/download-llama-server.sh --target aarch64-apple-darwin
          elif [[ "${{ matrix.platform }}" == "ubuntu-22.04" ]]; then
            ./scripts/download-llama-server.sh --target x86_64-unknown-linux-gnu
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            ./scripts/download-llama-server.sh --target x86_64-pc-windows-msvc
          fi
        shell: bash

      # ---- Sign llama.cpp dylibs (macOS only) ----
      # Apple notarization requires every Mach-O inside the app bundle to be
      # signed with a Developer ID certificate. The llama.cpp dylibs we
      # download from GitHub Releases are only ad-hoc signed and tauri-bundler
      # never signs `resources`, so we re-sign them here.
      #
      # The EXECUTABLES (llama-server, uv, cloudflared, matrx-syncd,
      # matrx-egress) are deliberately NOT signed here: they are signed with
      # `sidecar/sidecar.entitlements.plist` by the
      # "Stage and sign macOS helper executables" step below. Signing them here
      # would be wasted work — and before that step existed, tauri-bundler
      # OVERWROTE this signature with the HOST's entitlements file, which is
      # what SIGKILLed every helper at exec from v1.4.137 to v1.4.170
      # (feedback 696c1213).
      - name: Sign llama.cpp dylibs for notarization
        if: matrix.platform == 'macos-15'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          DYLIB_DIR="desktop/src-tauri/binaries"

          # Sign all dylibs first (they are loaded at runtime by the binary).
          # Per-file timeout via perl alarm (MXL-D-054): codesign can hang
          # forever on one file; a hang must fail loudly, not wedge the job.
          if ls "$DYLIB_DIR"/*.dylib 1>/dev/null 2>&1; then
            echo "Signing dylibs in $DYLIB_DIR with identity: $APPLE_SIGNING_IDENTITY"
            for dylib in "$DYLIB_DIR"/*.dylib; do
              echo "  Signing dylib: $(basename "$dylib")"
              perl -e 'alarm 120; exec @ARGV' codesign \
                --force \
                --timestamp \
                --options runtime \
                --sign "$APPLE_SIGNING_IDENTITY" \
                "$dylib" || { echo "ERROR: codesign failed or timed out on $dylib" >&2; exit 1; }
            done
            echo "✅ All dylibs signed"
          else
            echo "No dylibs found in $DYLIB_DIR — skipping dylib signing"
          fi

      # ---- Frontend + Tauri build ----
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            tesseract-ocr tesseract-ocr-eng libasound2-dev cmake libgcc-12-dev

      - name: Install macOS system dependencies
        if: matrix.platform == 'macos-15'
        run: brew install tesseract

      - name: Select an Xcode whose SDK knows the native Vault APIs
        if: matrix.platform == 'macos-15'
        # The native Vault exchange (desktop/native-vault-provider/*.swift) calls
        # AuthenticationServices credential-exchange APIs that exist only in the
        # macOS 26 SDK, behind @available(macOS 26.0, *). The runner's default
        # Xcode 16 ships the macOS 15 SDK, where those symbols do not exist at all,
        # so v1.4.181's Mac builds died on "cannot infer contextual base".
        # Pick the newest Xcode 26+ on the image; refuse loudly if there is none.
        run: |
          newest="$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$newest" ]; then
            echo "::error::No Xcode 26+ on this runner image; the native Vault exchange needs the macOS 26 SDK. Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$newest"
          echo "Using $newest — SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Install Windows system dependencies
        if: matrix.platform == 'windows-latest'
        run: |
          # cmake is required by whisper-cpp-plus-sys to compile whisper.cpp from source.
          # Explicitly install it (rather than relying on the VS2022 runner PATH) so the
          # build does not break if GitHub changes the runner image.
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install tesseract -y
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # ---- Pre-download whisper.cpp source ----
      # whisper-cpp-plus-sys downloads whisper.cpp from GitHub at compile time
      # using a single HTTP call with no retry. A transient CDN error fails the
      # whole build. We pre-download here with retries using Python (cross-platform,
      # always available) and set WHISPER_CPP_SOURCE_DIR so the Rust build script
      # uses the local copy and never touches the network.
      #
      # WHISPER_COMMIT must match WHISPER_CPP_VERSION in whisper-cpp-plus-sys/build.rs.
      # Update here whenever the whisper-cpp-plus crate is upgraded.
      - name: Pre-download whisper.cpp source
        shell: python
        run: |
          import os, sys, urllib.request, urllib.error, tarfile, shutil, time, pathlib

          WHISPER_COMMIT = "02de44819ba4f9cf3f3d2a4adcfc2c5130d7140a"
          WHISPER_REPO   = "rmorse/whisper.cpp"
          URL = f"https://github.com/{WHISPER_REPO}/archive/{WHISPER_COMMIT}.tar.gz"

          # Use workspace dir — always a clean native path on every platform
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          tarball   = workspace / "whisper.tar.gz"
          dest      = workspace / "whisper-cpp-src"
          dest.mkdir(exist_ok=True)

          # Download with retries
          print(f"Downloading whisper.cpp @ {WHISPER_COMMIT[:12]}...")
          for attempt in range(1, 6):
              try:
                  urllib.request.urlretrieve(URL, tarball)
                  # ASCII only — Windows runners use cp1252 for stdout; emoji crashes print()
                  print(f"  OK: Downloaded on attempt {attempt}")
                  break
              except urllib.error.URLError as e:
                  print(f"  attempt {attempt}/5 failed: {e}")
                  if attempt == 5:
                      sys.exit(f"ERROR: all download attempts failed: {e}")
                  time.sleep(10 * attempt)

          # Extract — tarfile is cross-platform and handles Windows paths correctly
          print("Extracting...")
          with tarfile.open(tarball, "r:gz") as tf:
              tf.extractall(workspace)

          # Tarball extracts to whisper.cpp-<commit>/ — move contents into dest
          extracted = next(workspace.glob(f"whisper.cpp-{WHISPER_COMMIT}*"), None)
          if not extracted or not extracted.is_dir():
              sys.exit(f"ERROR: expected directory whisper.cpp-{WHISPER_COMMIT[:8]}* not found in {workspace}")
          for item in extracted.iterdir():
              shutil.move(str(item), dest / item.name)
          extracted.rmdir()
          tarball.unlink()

          print(f"OK: whisper.cpp source ready at {dest}")

          # Write to GITHUB_ENV — use native path string (correct on all platforms)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"WHISPER_CPP_SOURCE_DIR={dest}\n")

      # ---- Rust folder-sync daemon sidecar ----
      # matrx-syncd is declared in bundle.externalBin on every platform, so the
      # -$TARGET_TRIPLE binary must exist before tauri-action runs or the build
      # fails. Cargo-built here (not downloaded), so tauri's bundler signs it
      # with the app on macOS — no separate re-sign step, unlike the
      # pre-built llama.cpp binaries above.
      - name: Build sync daemon sidecar (matrx-syncd)
        shell: bash
        run: |
          chmod +x scripts/build-syncd.sh
          if [ -n "${{ matrix.syncd_target }}" ]; then
            ./scripts/build-syncd.sh --target "${{ matrix.syncd_target }}"
          else
            ./scripts/build-syncd.sh
          fi

      # ---- Home-connection helper sidecar ----
      # matrx-egress is declared in bundle.externalBin on every platform (and
      # again in the macOS overlay, whose array REPLACES rather than merges),
      # so the -$TARGET_TRIPLE binary must exist before tauri-action runs or
      # the build fails. Same shape as matrx-syncd above, and for the same
      # reason: cargo-built here so tauri's bundler signs it with the app.
      - name: Build home-connection helper sidecar (matrx-egress)
        shell: bash
        run: |
          chmod +x scripts/build-egress.sh
          if [ -n "${{ matrix.syncd_target }}" ]; then
            ./scripts/build-egress.sh --sidecar --target "${{ matrix.syncd_target }}"
          else
            ./scripts/build-egress.sh --sidecar
          fi

      # ---- macOS helper executables (NEVER externalBin) ----
      # tauri-bundler signs EVERY `bundle.externalBin` entry with the ONE
      # `bundle.macOS.entitlements` file chosen for the HOST app. Once the host
      # started signing with Entitlements.vault.plist (2026-09-16, when the
      # Apple + Vault profile secrets landed), every helper inherited four
      # profile-backed keys it cannot carry without a provisioning profile, and
      # AMFI SIGKILLed each one at exec: exit 137 for matrx-syncd,
      # matrx-egress, cloudflared, llama-server and uv, in every release from
      # v1.4.137 to v1.4.170, while Gatekeeper and notarization both said
      # "accepted" (feedback 696c1213).
      #
      # So on macOS the helpers are `bundle.macOS.files` instead — copied
      # verbatim into Contents/MacOS and never touched by the bundler's
      # codesign (which carries no --deep) — exactly like the nested
      # Matrx Engine.app that kept working throughout the outage. They are
      # signed HERE, with sidecar/sidecar.entitlements.plist. Windows and Linux
      # keep externalBin; nothing below runs there.
      - name: Stage and sign macOS helper executables
        if: matrix.platform == 'macos-15'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_SIGNING_IDENTITY" ]] || { echo "ERROR: APPLE_SIGNING_IDENTITY is required to sign the macOS helpers." >&2; exit 1; }
          if [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi
          chmod +x scripts/stage-macos-helpers.sh
          ./scripts/stage-macos-helpers.sh \
            --target "$TRIPLE" \
            --require-all \
            --sign "$APPLE_SIGNING_IDENTITY"

      - name: Build and release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Supabase publishable keys — inlined by Vite at build time
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          # Scraper server URL — public, not a secret. All scraper API calls go here.
          # Authenticated users' Supabase JWTs are forwarded; no user-level API key needed.
          SCRAPER_SERVER_URL: "https://scraper.app.matrxserver.com"
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Provider signing inputs exist only when the provider is sealed; the
          # build hook refuses a half-supplied pair, so both are gated together.
          MATRX_NATIVE_VAULT_PROVIDER: ${{ env.MATRX_NATIVE_VAULT_PROVIDER }}
          MATRX_APPLE_SIGNING_IDENTITY: ${{ env.MATRX_NATIVE_VAULT_PROVIDER == 'sealed' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          MATRX_VAULT_PROVIDER_PROFILE_FILE: ${{ env.MATRX_NATIVE_VAULT_PROVIDER == 'sealed' && format('{0}/vault-provider.provisionprofile', runner.temp) || '' }}
          MATRX_SAFARI_WEB_EXTENSION: ${{ matrix.platform == 'macos-15' && 'sealed' || 'absent' }}
          MATRX_SAFARI_EXTENSION_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-15' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          # Every matrix leg uploads to the one draft created above. This is
          # the race-free path documented by tauri-action for existing releases.
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: v__VERSION__
          releaseName: "AI Matrx v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          # Matrix jobs share one draft. Publish only after every platform and
          # the updater-asset repair job complete successfully.
          releaseDraft: true
          prerelease: false
          # GitHub asset uploads can fail transiently after a successful signed build.
          # Retry the action's upload path before discarding a platform matrix job.
          uploadUpdaterJson: true
          retryAttempts: 10
          # Release builds always use the provider + host-profile config. The
          # host-only config is retained for local smoke work only.
          args: ${{ matrix.args }}${{ matrix.platform == 'macos-15' && ' --config src-tauri/tauri.release.macos.conf.json' || '' }}

      # ---- Verify the FINAL macOS artifact (signing/identity/notarization) ----
      # The build scripts sign; this step PROVES the shipped artifact honors
      # the contract. It inspects both the bundle .app and the .app inside the
      # updater .app.tar.gz (what updates actually deliver): deep signature
      # validity, parent↔helper designated-requirement equivalence (one TCC
      # identity — the May 2026 false-FDA regression class), entitlements,
      # Gatekeeper acceptance, and stapled notarization. A failure here fails
      # the matrix job, so the draft release is never published. Note:
      # tauri-action has already uploaded assets to the DRAFT at this point —
      # acceptable, since the draft only publishes when all jobs succeed.
      - name: Verify macOS artifact signing
        if: matrix.platform == 'macos-15'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi
          BUNDLE_DIR="desktop/src-tauri/target/$TRIPLE/release/bundle/macos"
          APP="$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.app" -type d | head -1)"
          [[ -n "$APP" ]] || { echo "No .app found in $BUNDLE_DIR" >&2; exit 1; }
          ./scripts/verify-macos-artifact.sh "$APP"
          UPDATER_TAR="$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.app.tar.gz" | head -1)"
          if [[ -n "$UPDATER_TAR" ]]; then
            ./scripts/verify-macos-artifact.sh "$UPDATER_TAR"
          else
            echo "WARNING: no updater .app.tar.gz found in $BUNDLE_DIR" >&2
            exit 1
          fi

      # Tauri notarizes and staples the app, but the separately signed DMG does
      # not inherit that ticket. Gatekeeper checks the downloaded disk image
      # before a user can open the app inside it. Notarize that exact container,
      # staple it, then replace the draft asset before rename/publish proceeds.
      - name: Notarize and verify macOS disk image
        if: matrix.platform == 'macos-15'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi
          DMG_DIR="desktop/src-tauri/target/$TRIPLE/release/bundle/dmg"
          DMG="$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          [[ -n "$DMG" ]] || { echo "No .dmg found in $DMG_DIR" >&2; exit 1; }
          NOTARY_RESULT="$(xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)"
          jq -e '.status == "Accepted"' <<< "$NOTARY_RESULT" >/dev/null || {
            echo "Apple did not accept the DMG for notarization" >&2
            exit 1
          }
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"

          TAG="v$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          for ATTEMPT in 1 2 3; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$DMG"; then
              break
            fi
            if [[ "$ATTEMPT" -eq 3 ]]; then
              echo "Could not upload stapled DMG after three attempts" >&2
              exit 1
            fi
            sleep "$((ATTEMPT * 10))"
          done
          EXPECTED="sha256:$(shasum -a 256 "$DMG" | awk '{print $1}')"
          # GitHub replaces spaces in uploaded asset names with dots. Compare
          # the digest of the actual uploaded name, not the local filename.
          ASSET_NAME="$(basename "$DMG" | tr ' ' '.')"
          ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | select(.name == "'"$ASSET_NAME"'") | .digest')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "Uploaded DMG checksum differs from stapled disk image" >&2
            exit 1
          }

  # ── Rename assets to human-friendly names ──────────────────────────────────
  rename-assets:
    needs: [verify, release]
    if: ${{ always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.recover_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: version
        env:
          RECOVER_TAG: ${{ inputs.recover_tag }}
        # Tag push: derive from the ref. workflow_dispatch: the ref is a branch,
        # so read the version from tauri.conf.json (the same source tauri-action
        # used to create the release tag).
        run: |
          if [[ -n "$RECOVER_TAG" ]]; then
            TAG="$RECOVER_TAG"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "recover_tag must have the form vX.Y.Z (received: $TAG)" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG}"

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          RECOVER_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$({
            gh api --paginate "repos/${REPO}/releases?per_page=100"
          } | jq -sc --arg tag "$TAG" 'add | map(select(.tag_name == $tag)) | first')"
          RELEASE_ID="$(jq -r '.id // empty' <<< "$RELEASE_JSON")"
          IS_DRAFT="$(jq -r 'if type == "object" then (.draft | tostring) else empty end' <<< "$RELEASE_JSON")"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Release $TAG was not found in ${REPO}" >&2
            exit 1
          fi
          if [[ "$IS_DRAFT" != "true" && -z "$RECOVER_TAG" ]]; then
            echo "Release $TAG is not a draft; refusing to mutate a published release" >&2
            exit 1
          fi
          echo "id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "is_draft=${IS_DRAFT}" >> "$GITHUB_OUTPUT"
          echo "Resolved release ${TAG} to id=${RELEASE_ID} draft=${IS_DRAFT}"

      - name: Rename release assets
        if: steps.release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          RELEASE_ID="${{ steps.release.outputs.id }}"

          echo "🏷  Tag: $TAG  Version: $VERSION"
          echo ""

          # Draft releases are intentionally absent from the release-by-tag REST
          # endpoint. Resolve the draft once above, then address it by numeric ID.
          ASSETS_JSON=$(gh api --paginate \
            "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | {id: .id, name: .name, size: .size, digest: .digest}' | jq -s '.')

          rename_asset() {
            local old="$1" new="$2"
            if [[ "$old" == "$new" ]]; then return; fi
            local asset_id destination_id old_digest new_digest old_size new_size
            asset_id=$(jq -r --arg name "$old" '.[] | select(.name == $name) | .id' <<< "$ASSETS_JSON")
            if [[ -z "$asset_id" ]]; then
              echo "  ⚠  Asset not found: $old (skipping)"
              return
            fi
            destination_id=$(jq -r --arg name "$new" '.[] | select(.name == $name) | .id' <<< "$ASSETS_JSON")
            if [[ -n "$destination_id" ]]; then
              old_digest=$(jq -r --arg name "$old" '.[] | select(.name == $name) | .digest // empty' <<< "$ASSETS_JSON")
              new_digest=$(jq -r --arg name "$new" '.[] | select(.name == $name) | .digest // empty' <<< "$ASSETS_JSON")
              old_size=$(jq -r --arg name "$old" '.[] | select(.name == $name) | .size' <<< "$ASSETS_JSON")
              new_size=$(jq -r --arg name "$new" '.[] | select(.name == $name) | .size' <<< "$ASSETS_JSON")
              if [[ -n "$old_digest" && "$old_digest" == "$new_digest" && "$old_size" == "$new_size" ]]; then
                echo "  🧹 Removing byte-identical duplicate: $old"
                gh api --method DELETE "repos/${REPO}/releases/assets/${asset_id}" --silent
                return
              fi
              echo "Rename collision: both $old and $new exist with different or unknown content" >&2
              exit 1
            fi
            echo "  📦 $old → $new"
            # PATCH the asset name in-place — no download/upload needed
            gh api --method PATCH "repos/${REPO}/releases/assets/${asset_id}" \
              -f name="$new" --silent
          }

          while IFS= read -r ASSET; do
            case "$ASSET" in
              # ── macOS Apple Silicon ──
              *_aarch64.app.tar.gz)
                rename_asset "$ASSET" "ai-matrx-mac-silicon-${VERSION}.app.tar.gz" ;;
              *_aarch64.app.tar.gz.sig)
                rename_asset "$ASSET" "ai-matrx-mac-silicon-${VERSION}.app.tar.gz.sig" ;;
              *_aarch64.dmg)
                rename_asset "$ASSET" "ai-matrx-mac-silicon-${VERSION}.dmg" ;;

              # ── macOS Intel ──
              *_x64.app.tar.gz)
                rename_asset "$ASSET" "ai-matrx-mac-intel-${VERSION}.app.tar.gz" ;;
              *_x64.app.tar.gz.sig)
                rename_asset "$ASSET" "ai-matrx-mac-intel-${VERSION}.app.tar.gz.sig" ;;
              *_x64.dmg)
                rename_asset "$ASSET" "ai-matrx-mac-intel-${VERSION}.dmg" ;;

              # ── Linux ──
              *_amd64.deb)
                rename_asset "$ASSET" "ai-matrx-linux-${VERSION}.deb" ;;
              *_amd64.deb.sig)
                rename_asset "$ASSET" "ai-matrx-linux-${VERSION}.deb.sig" ;;

              # ── Windows installer (.exe / NSIS) ──
              *_x64-setup.exe)
                rename_asset "$ASSET" "ai-matrx-windows-installer-${VERSION}.exe" ;;
              *_x64-setup.exe.sig)
                rename_asset "$ASSET" "ai-matrx-windows-installer-${VERSION}.exe.sig" ;;

              # ── Windows MSI ──
              *_x64_en-US.msi)
                rename_asset "$ASSET" "ai-matrx-windows-${VERSION}.msi" ;;
              *_x64_en-US.msi.sig)
                rename_asset "$ASSET" "ai-matrx-windows-${VERSION}.msi.sig" ;;

              # ── NSIS zip bundle (if present) ──
              *_x64-setup.nsis.zip)
                rename_asset "$ASSET" "ai-matrx-windows-installer-${VERSION}.nsis.zip" ;;
              *_x64-setup.nsis.zip.sig)
                rename_asset "$ASSET" "ai-matrx-windows-installer-${VERSION}.nsis.zip.sig" ;;

              # ── Already normalized or managed by the manifest steps ──
              "ai-matrx-mac-silicon-${VERSION}.app.tar.gz" | \
              "ai-matrx-mac-silicon-${VERSION}.app.tar.gz.sig" | \
              "ai-matrx-mac-silicon-${VERSION}.dmg" | \
              "ai-matrx-mac-intel-${VERSION}.app.tar.gz" | \
              "ai-matrx-mac-intel-${VERSION}.app.tar.gz.sig" | \
              "ai-matrx-mac-intel-${VERSION}.dmg" | \
              "ai-matrx-linux-${VERSION}.deb" | \
              "ai-matrx-linux-${VERSION}.deb.sig" | \
              "ai-matrx-windows-installer-${VERSION}.exe" | \
              "ai-matrx-windows-installer-${VERSION}.exe.sig" | \
              "ai-matrx-windows-${VERSION}.msi" | \
              "ai-matrx-windows-${VERSION}.msi.sig" | \
              "ai-matrx-windows-installer-${VERSION}.nsis.zip" | \
              "ai-matrx-windows-installer-${VERSION}.nsis.zip.sig" | \
              latest.json | latest.recovery.json)
                echo "  ⏭  Skipping $ASSET" ;;

              *)
                echo "Unknown release asset: $ASSET" >&2
                exit 1 ;;
            esac
          done < <(jq -r '.[].name' <<< "$ASSETS_JSON")

          echo ""
          echo "✅ Asset rename complete"

      - name: Patch latest.json URLs
        if: steps.release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          PREFIX="AI-Matrx_${VERSION}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          rm -rf /tmp/updater
          mkdir -p /tmp/updater
          ASSET_NAMES="$(gh api --paginate \
            "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[].name')"
          if grep -Fxq "latest.json" <<< "$ASSET_NAMES"; then
            gh release download "$TAG" --repo "$REPO" \
              --pattern "latest.json" --dir /tmp/updater
            cp /tmp/updater/latest.json /tmp/updater/latest.recovery.json
            # Keep a recovery source on the draft release until the final
            # manifest upload succeeds. Clobber can delete before upload.
            gh release upload "$TAG" --repo "$REPO" --clobber /tmp/updater/latest.recovery.json
          elif grep -Fxq "latest.recovery.json" <<< "$ASSET_NAMES"; then
            echo "latest.json is absent; recovering from the prior failed attempt"
            gh release download "$TAG" --repo "$REPO" \
              --pattern "latest.recovery.json" --dir /tmp/updater
            cp /tmp/updater/latest.recovery.json /tmp/updater/latest.json
          else
            echo "Neither latest.json nor latest.recovery.json exists on $TAG" >&2
            exit 1
          fi

          # Rebuild the URL for each platform key by mapping to the known renamed filename.
          # This is resilient to whatever Tauri named the original file — we only care about
          # the final renamed asset names (set in the "Rename release assets" step above).
          python3 << 'PYEOF'
          import json, os

          tag      = os.environ["TAG"]
          version  = os.environ["VERSION"]
          repo     = os.environ["REPO"]
          prefix   = f"AI-Matrx_{version}"
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          # Map: latest.json platform key -> renamed asset filename
          PLATFORM_ASSETS = {
              "darwin-aarch64":      f"ai-matrx-mac-silicon-{version}.app.tar.gz",
              "darwin-aarch64-app":  f"ai-matrx-mac-silicon-{version}.app.tar.gz",
              "darwin-x86_64":       f"ai-matrx-mac-intel-{version}.app.tar.gz",
              "darwin-x86_64-app":   f"ai-matrx-mac-intel-{version}.app.tar.gz",
              "linux-x86_64":        f"ai-matrx-linux-{version}.deb",
              "linux-x86_64-deb":    f"ai-matrx-linux-{version}.deb",
              "windows-x86_64":      f"ai-matrx-windows-{version}.msi",
              "windows-x86_64-msi":  f"ai-matrx-windows-{version}.msi",
              "windows-x86_64-nsis": f"ai-matrx-windows-installer-{version}.exe",
          }

          with open("/tmp/updater/latest.json") as f:
              data = json.load(f)

          patched = 0
          for key, entry in data.get("platforms", {}).items():
              if key in PLATFORM_ASSETS:
                  new_url = f"{base_url}/{PLATFORM_ASSETS[key]}"
                  if entry["url"] != new_url:
                      print(f"  🔗 {key}: {entry['url'].split('/')[-1]} → {PLATFORM_ASSETS[key]}")
                      entry["url"] = new_url
                      patched += 1

          with open("/tmp/updater/latest.json", "w") as f:
              json.dump(data, f, indent=2)

          print(f"\n✅ Patched {patched} URLs in latest.json")
          PYEOF

          echo ""
          echo "📝 Final latest.json:"
          cat /tmp/updater/latest.json

          # The separate recovery asset keeps reruns possible if clobber's
          # delete-then-upload replacement is interrupted.
          gh release upload "$TAG" --repo "$REPO" --clobber /tmp/updater/latest.json

          echo ""
          echo "✅ latest.json updated"

      - name: Reconstruct missing platforms from current release
        if: steps.release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Expose shell variables as env vars so the Python heredoc can read them
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail

          rm -rf /tmp/fill
          mkdir -p /tmp/fill

          # All platform keys Tauri expects. The matrix builders can race while
          # updating latest.json, so reconstruct omitted entries from this
          # release's own signed assets before validating the manifest.
          python3 << 'PYEOF'
          import json, os, subprocess, sys, urllib.parse, urllib.request

          tag  = os.environ["TAG"]
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          release_id = os.environ["RELEASE_ID"]
          gh_token = os.environ["GH_TOKEN"]

          EXPECTED_PLATFORMS = {
              "darwin-aarch64", "darwin-aarch64-app",
              "darwin-x86_64",  "darwin-x86_64-app",
              "linux-x86_64",   "linux-x86_64-deb",
              "windows-x86_64", "windows-x86_64-msi", "windows-x86_64-nsis",
          }

          def gh_get(path):
              url = f"https://api.github.com/repos/{repo}/{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {gh_token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "release-workflow",
              })
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Load the current release's latest.json (already patched by previous step)
          subprocess.run(
              ["gh", "release", "download", tag, "--repo", repo,
               "--pattern", "latest.json", "--dir", "/tmp/fill", "--clobber"],
              check=True
          )
          with open("/tmp/fill/latest.json") as f:
              current = json.load(f)

          import base64, pathlib

          missing = EXPECTED_PLATFORMS - set(current["platforms"].keys())
          if not missing:
              print(f"✅ All {len(EXPECTED_PLATFORMS)} platforms present — nothing to reconstruct.")
          else:
              platform_assets = {
                  "darwin-aarch64":      f"ai-matrx-mac-silicon-{version}.app.tar.gz",
                  "darwin-aarch64-app":  f"ai-matrx-mac-silicon-{version}.app.tar.gz",
                  "darwin-x86_64":       f"ai-matrx-mac-intel-{version}.app.tar.gz",
                  "darwin-x86_64-app":   f"ai-matrx-mac-intel-{version}.app.tar.gz",
                  "linux-x86_64":        f"ai-matrx-linux-{version}.deb",
                  "linux-x86_64-deb":    f"ai-matrx-linux-{version}.deb",
                  "windows-x86_64":      f"ai-matrx-windows-{version}.msi",
                  "windows-x86_64-msi":  f"ai-matrx-windows-{version}.msi",
                  "windows-x86_64-nsis": f"ai-matrx-windows-installer-{version}.exe",
              }
              sig_dir = pathlib.Path("/tmp/fill/current-signatures")
              sig_dir.mkdir(parents=True, exist_ok=True)
              downloaded = set()
              for key in sorted(missing):
                  asset_name = platform_assets[key]
                  sig_name = f"{asset_name}.sig"
                  if sig_name not in downloaded:
                      subprocess.run(
                          ["gh", "release", "download", tag, "--repo", repo,
                           "--pattern", sig_name, "--dir", str(sig_dir), "--clobber"],
                          check=True,
                      )
                      downloaded.add(sig_name)
                  signature = base64.b64encode(
                      (sig_dir / sig_name).read_bytes()
                  ).decode()
                  current["platforms"][key] = {
                      "signature": signature,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{asset_name}",
                  }
                  print(f"  🔧 Reconstructed {key} from current signed asset {asset_name}")
                  missing.discard(key)

              print(f"✅ Reconstructed current-release entries; {len(current['platforms'])} platforms present.")

              if missing:
                  print(
                      f"❌ REFUSING release {tag}: updater manifest is still missing "
                      f"{sorted(missing)} after current-artifact reconstruction."
                  )
                  sys.exit(1)

          if missing:
              print(f"❌ Could not find backfill for: {missing} (no prior release has them)")
              sys.exit(1)
          else:
              print("✅ All missing platforms backfilled.")

          # Keys alone are insufficient: an unexpected Tauri filename can
          # leave a syntactically complete manifest whose URLs all return 404.
          # Draft assets are not publicly downloadable yet, so validate current
          # assets through GitHub's authenticated asset API. Backfilled assets
          # belong to public releases and can be probed through their URLs.
          current_release = gh_get(f"releases/{release_id}")
          current_assets = {
              asset["name"]: asset for asset in current_release.get("assets", [])
          }
          expected_assets = {
              f"ai-matrx-mac-silicon-{version}.app.tar.gz",
              f"ai-matrx-mac-silicon-{version}.app.tar.gz.sig",
              f"ai-matrx-mac-silicon-{version}.dmg",
              f"ai-matrx-mac-intel-{version}.app.tar.gz",
              f"ai-matrx-mac-intel-{version}.app.tar.gz.sig",
              f"ai-matrx-mac-intel-{version}.dmg",
              f"ai-matrx-linux-{version}.deb",
              f"ai-matrx-linux-{version}.deb.sig",
              f"ai-matrx-windows-installer-{version}.exe",
              f"ai-matrx-windows-installer-{version}.exe.sig",
              f"ai-matrx-windows-{version}.msi",
              f"ai-matrx-windows-{version}.msi.sig",
              "latest.json",
              "latest.recovery.json",
          }
          optional_nsis = {
              f"ai-matrx-windows-installer-{version}.nsis.zip",
              f"ai-matrx-windows-installer-{version}.nsis.zip.sig",
          }
          asset_names = set(current_assets)
          missing_assets = expected_assets - asset_names
          unknown_assets = asset_names - expected_assets - optional_nsis
          present_optional = asset_names & optional_nsis
          if missing_assets:
              raise SystemExit(f"❌ Missing release assets: {sorted(missing_assets)}")
          if unknown_assets:
              raise SystemExit(f"❌ Unexpected release assets: {sorted(unknown_assets)}")
          if present_optional and present_optional != optional_nsis:
              raise SystemExit(
                  f"❌ Incomplete optional NSIS bundle: {sorted(present_optional)}"
              )
          empty_assets = sorted(
              name for name, asset in current_assets.items()
              if int(asset.get("size") or 0) <= 0
          )
          if empty_assets:
              raise SystemExit(f"❌ Empty release assets: {empty_assets}")
          print(f"✅ Exact release asset set verified ({len(asset_names)} assets).")

          for key in sorted(EXPECTED_PLATFORMS):
              entry = current["platforms"][key]
              signature = str(entry.get("signature") or "").strip()
              url = str(entry.get("url") or "").strip()
              if not signature:
                  raise SystemExit(f"❌ {key} has an empty updater signature")
              if not url:
                  raise SystemExit(f"❌ {key} has an empty updater URL")
              parsed = urllib.parse.urlparse(url)
              parts = parsed.path.split("/")
              try:
                  download_index = parts.index("download")
                  asset_tag = parts[download_index + 1]
                  asset_name = urllib.parse.unquote(parts[download_index + 2])
              except (ValueError, IndexError):
                  raise SystemExit(f"❌ {key} has an invalid updater URL: {url}")

              if asset_tag == tag:
                  asset = current_assets.get(asset_name)
                  if not asset:
                      raise SystemExit(f"❌ {key} references missing draft asset {asset_name}")
                  metadata = gh_get(f"releases/assets/{asset['id']}")
                  if metadata.get("name") != asset_name or int(metadata.get("size") or 0) <= 0:
                      raise SystemExit(f"❌ {key} draft asset is empty or invalid: {asset_name}")
              else:
                  req = urllib.request.Request(url, method="HEAD", headers={
                      "User-Agent": "release-workflow",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if response.status >= 400:
                              raise RuntimeError(f"HTTP {response.status}")
                  except Exception as exc:
                      raise SystemExit(
                          f"❌ {key} updater URL is unavailable: {url} ({exc})"
                      )
              print(f"  ✅ {key}: signed asset reachable")

          with open("/tmp/fill/latest.json", "w") as f:
              json.dump(current, f, indent=2)

          print("\n📝 Final latest.json:")
          print(json.dumps(current, indent=2))
          PYEOF

          # The recovery copy remains available while clobber replaces latest.json.
          gh release upload "$TAG" --repo "$REPO" --clobber /tmp/fill/latest.json
          gh release delete-asset "$TAG" --repo "$REPO" --yes \
            "latest.recovery.json"

          echo ""
          echo "✅ Backfilled latest.json uploaded"

      - name: Publish verified release
        if: steps.release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf /tmp/published-release
          mkdir -p /tmp/published-release
          gh api "repos/${REPO}/releases/tags/${TAG}" \
            > /tmp/published-release/release.json
          gh release download "$TAG" --repo "$REPO" \
            --pattern latest.json --dir /tmp/published-release

          python3 << 'PYEOF'
          import json
          import os
          import urllib.parse
          from pathlib import Path

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          release = json.loads(
              Path("/tmp/published-release/release.json").read_text()
          )
          manifest = json.loads(
              Path("/tmp/published-release/latest.json").read_text()
          )

          expected_assets = {
              f"ai-matrx-mac-silicon-{version}.app.tar.gz",
              f"ai-matrx-mac-silicon-{version}.app.tar.gz.sig",
              f"ai-matrx-mac-silicon-{version}.dmg",
              f"ai-matrx-mac-intel-{version}.app.tar.gz",
              f"ai-matrx-mac-intel-{version}.app.tar.gz.sig",
              f"ai-matrx-mac-intel-{version}.dmg",
              f"ai-matrx-linux-{version}.deb",
              f"ai-matrx-linux-{version}.deb.sig",
              f"ai-matrx-windows-installer-{version}.exe",
              f"ai-matrx-windows-installer-{version}.exe.sig",
              f"ai-matrx-windows-{version}.msi",
              f"ai-matrx-windows-{version}.msi.sig",
              "latest.json",
          }
          optional_nsis = {
              f"ai-matrx-windows-installer-{version}.nsis.zip",
              f"ai-matrx-windows-installer-{version}.nsis.zip.sig",
          }
          expected_platforms = {
              "darwin-aarch64", "darwin-aarch64-app",
              "darwin-x86_64", "darwin-x86_64-app",
              "linux-x86_64", "linux-x86_64-deb",
              "windows-x86_64", "windows-x86_64-msi",
              "windows-x86_64-nsis",
          }

          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("❌ Release is not a stable public release")
          assets = {
              asset["name"]: asset for asset in release.get("assets", [])
          }
          names = set(assets)
          missing = expected_assets - names
          unknown = names - expected_assets - optional_nsis
          present_optional = names & optional_nsis
          if missing or unknown:
              raise SystemExit(
                  f"❌ Published asset mismatch: missing={sorted(missing)} "
                  f"unknown={sorted(unknown)}"
              )
          if present_optional and present_optional != optional_nsis:
              raise SystemExit("❌ Published optional NSIS bundle is incomplete")
          if any(int(asset.get("size") or 0) <= 0 for asset in assets.values()):
              raise SystemExit("❌ Published release contains an empty asset")
          if manifest.get("version") != version:
              raise SystemExit(
                  f"❌ Manifest version is {manifest.get('version')}, expected {version}"
              )
          platforms = manifest.get("platforms", {})
          if set(platforms) != expected_platforms:
              raise SystemExit("❌ Published updater platform set is incomplete")
          for platform, entry in platforms.items():
              if not str(entry.get("signature") or "").strip():
                  raise SystemExit(f"❌ {platform} has an empty signature")
              url = str(entry.get("url") or "")
              parsed = urllib.parse.urlparse(url)
              parts = parsed.path.split("/")
              try:
                  download_index = parts.index("download")
                  asset_tag = parts[download_index + 1]
                  filename = urllib.parse.unquote(parts[download_index + 2])
              except (ValueError, IndexError):
                  raise SystemExit(
                      f"❌ {platform} has an invalid updater URL: {url}"
                  )
              if asset_tag == tag and filename not in assets:
                  raise SystemExit(
                      f"❌ {platform} references missing current asset {filename}"
                  )
          print(
              f"✅ {tag}: {len(assets)} assets and "
              f"{len(platforms)} signed updater entries verified"
          )
          PYEOF

          jq -r '.platforms[].url' /tmp/published-release/latest.json |
            sort -u |
            while IFS= read -r url; do
              code=$(curl --retry 3 --retry-all-errors --retry-delay 2 \
                -LIsS --max-time 60 -o /dev/null -w '%{http_code}' "$url")
              if [[ "$code" != "200" ]]; then
                echo "Updater URL returned HTTP $code: $url" >&2
                exit 1
              fi
              echo "✅ HTTP 200: ${url##*/}"
            done
